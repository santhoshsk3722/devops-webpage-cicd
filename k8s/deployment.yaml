apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-webpage
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: my-webpage
    
  template:
    metadata:
      labels:
        app: my-webpage
    spec:
      containers:
      - name: my-webpage
        image: my-webpage:1.0
        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "10m"
          limits:
            cpu: "200m"

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20